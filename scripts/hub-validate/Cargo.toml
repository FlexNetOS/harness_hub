# Standalone crate: harness_hub is gitignored from the parent meta workspace,
# so this manifest must opt out of the parent Cargo workspace.
[workspace]

[package]
name = "hub-validate"
version = "0.1.0"
edition = "2021"
description = "Rust-native validator for the harness_hub catalog (Hub Standard). Replaces the former scripts/validate.py."
license = "MIT"

[[bin]]
name = "hub-validate"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"

[profile.release]
opt-level = 1
